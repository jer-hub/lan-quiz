services:
  lanquiz:
    build: .
    image: lanquiz:latest
    container_name: lanquiz
    ports:
      - "${PORT:-8000}:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      HOST_IP: "${HOST_IP:-localhost}"
      DATA_DIR: "/app/data"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SCORE_BASE: "${SCORE_BASE:-1000}"
      JWT_SECRET: "${JWT_SECRET:-change-me-lanquiz-dev-secret}"
      JWT_EXPIRE_HOURS: "${JWT_EXPIRE_HOURS:-72}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
